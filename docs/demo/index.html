<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MatchFit &mdash; scoping demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ============================================================
   1. TOKENS  — the only place a hex may appear (plus the dark block)
   ============================================================ */
:root{
  /* --- brand --- */
  --brand-1:#151C25;      /* structural / chrome: rail, phone edge, primary action */
  --brand-2:#22303F;      /* chrome lift */
  --brand-3:#1D9A66;      /* positive meaning (FILL only - 3.58:1) */
  --brand-4:#8E1F1C;      /* emergency */
  --danger:#C0392B;
  --warn:#B5761A;         /* FILL only - 3.77:1 */

  /* --- type colour, SEPARATE from chrome (rule 3) --- */
  --ink:#111823;
  --ink-2:#4F5966;
  --muted-1:#8A929E;
  --muted-2:#B4BBC4;

  /* --- surfaces --- */
  --canvas:#E7EBEF;         /* page behind the device frame */
  --canvas-screen:#F4F7F9;  /* inside the device */
  --surface:#FFFFFF;
  --surface-2:#EEF2F5;
  --line:rgba(17,24,35,.09);
  --line-hard:rgba(17,24,35,.16);
  --tabbar:rgba(255,255,255,.97);
  --phone-edge:#C4CDD6;
  --rail:#FFFFFF;

  /* --- sport accents: FILLS --- */
  --sp-rugby:#17643E; --sp-soccer:#22499E; --sp-hockey:#0C7B80; --sp-netball:#C2631F;

  /* --- FILL vs TEXT (rule 1). Verified: see README contrast table --- */
  --ok-text:#14764D;        /* 5.63:1 */
  --warn-text:#8A5A12;      /* 5.91:1 */
  --netball-text:#A8541A;   /* 5.32:1 */
  --danger-text:#C0392B;    /* 5.44:1, already clears */

  /* --- semantic tints --- */
  --tint-ok:#E7F5EC; --tint-warn:#FBF2DF; --tint-bad:#F7E6E5; --tint-info:#E9EEF4;
  --tint-rugby:#E6F0EA; --tint-soccer:#E7EDF8; --tint-hockey:#E2F1F1; --tint-netball:#FAEDE2;

  /* --- partner colours: integration surfaces read as foreign (§10) --- */
  --partner-line:#1B3C8C;   /* Oneplan, the underwriting manager */
  --partner-2:#D6001C;      /* insurance partner */

  /* --- fixed brand assets: pinned to literal hexes, never themed (rule 2) --- */
  --grad:linear-gradient(-45deg,#2A3B4E 0%,#22303F 35%,#151C25 72%,#0B1219 100%);
  /* the card face is a brand asset. Built from --sp-* it silently turned mint in
     dark mode, which is exactly the failure rule 2 describes. Pinned instead. */
  --card-rugby:linear-gradient(135deg,#2E8B60 -25%,#17643E 45%,#0B1219 100%);
  --card-soccer:linear-gradient(135deg,#3A66C4 -25%,#22499E 45%,#0B1219 100%);
  --card-hockey:linear-gradient(135deg,#199A9F -25%,#0C7B80 45%,#0B1219 100%);
  --card-netball:linear-gradient(135deg,#DD803C -25%,#C2631F 45%,#0B1219 100%);
  --card-deep:#0B1219;
  --chip:linear-gradient(135deg,#E8CF7E,#C9A24B 60%,#A9843A);
  --qr-quiet:#FFFFFF;      /* a QR quiet zone must stay white or a scanner fails */

  /* --- roadmap phases. Four steps, so they separate by lightness AND hue --- */
  --ph1:#14764D; --ph1-t:#E7F5EC;
  --ph2:#17457E; --ph2-t:#E6EDF6;
  --ph3:#7A4E9C; --ph3-t:#F0E9F6;
  --ph4:#6B6F76; --ph4-t:#ECEEF0;

  /* --- text ON a brand fill. Also fixed: a brand fill does not invert. --- */
  --on-brand:#FFFFFF;     /* on brand-1 / brand-4 / partner fills */
  --on-accent:#10151A;    /* on the light accents dark mode uses for fills */

  /* --- coach field portal: a scoped dark chrome, tokenised so no rule hardcodes --- */
  --coach-surface:#16241D; --coach-surface-2:#1B2F26; --coach-canvas:#0E1713;
  --coach-ink:#EAF2ED; --coach-ink-2:#A8C3B6; --coach-muted:#7FA08F;

  --r-card:18px; --r-btn:14px;
  --font:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;
}

/* ============================================================
   2. DARK — re-points tokens only. brand-1/2 and --grad stay put.
   ============================================================ */
[data-theme="dark"]{
  --ph1:#5BC28C; --ph1-t:#12281E;
  --ph2:#7FA3E8; --ph2-t:#16203A;
  --ph3:#C3A2E0; --ph3-t:#241C33;
  --ph4:#A9AFB6; --ph4-t:#23272B;

  --ink:#E8EAEC; --ink-2:#A7ADB2; --muted-1:#959CA3; --muted-2:#6E757C;

  --canvas:#0C0F12; --canvas-screen:#12171C; --surface:#1A2027; --surface-2:#222932;
  --line:rgba(255,255,255,.09); --line-hard:rgba(255,255,255,.16);
  --tabbar:rgba(26,32,39,.97); --phone-edge:#2E363E; --rail:#161B21;

  --brand-3:#5BC28C; --brand-4:#E8918E; --danger:#E58C89; --warn:#DDA455;

  --sp-rugby:#5FBF8E; --sp-soccer:#7FA3E8; --sp-hockey:#57C2C7; --sp-netball:#E09257;

  --ok-text:#5BC28C; --warn-text:#DDA455; --netball-text:#E09257; --danger-text:#E58C89;

  /* dark tints HAND-PICKED to lean into hue, not derived (rule 5).
     They sit within 1.09:1 of each other, so state must also carry a label. */
  --tint-ok:#12281E; --tint-warn:#2A2214; --tint-bad:#2A1717; --tint-info:#1A222B;
  --tint-rugby:#0F2419; --tint-soccer:#16203A; --tint-hockey:#0E2427; --tint-netball:#2B1D12;

  --partner-line:#6F9FE8; --partner-2:#E8918E;
}

/* ============================================================
   3. SHELL
   ============================================================ */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--canvas);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0;text-align:left}
:focus-visible{outline:2px solid var(--partner-line);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:268px 1fr 320px;height:100vh;overflow:hidden}
@media(max-width:1180px){.app{grid-template-columns:210px 1fr}.notes-col{display:none}}

/* left rail */
.rail{background:var(--rail);border-right:1px solid var(--line);overflow-y:auto;padding:0 0 30px}
.rail .brand{padding:20px 18px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--rail);z-index:5}
.rail .brand b{font-size:16px;font-weight:900;letter-spacing:-.03em;display:block}
.rail .brand small{font-family:var(--mono);font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted-1);display:block;margin-top:2px}
.rail h4{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-1);margin:18px 18px 6px;font-weight:600}
.rail a{display:flex;align-items:center;gap:9px;padding:7px 18px;font-size:12.5px;color:var(--ink-2);text-decoration:none;border-left:3px solid transparent}
.rail a:hover{background:var(--surface-2);color:var(--ink)}
.rail a.on{background:var(--surface-2);color:var(--ink);border-left-color:var(--brand-1);font-weight:700}
[data-theme="dark"] .rail a.on{border-left-color:var(--ok-text)}
.rail a .sid{font-family:var(--mono);font-size:9px;color:var(--muted-1);width:22px;flex:none}
.rail a.on .sid{color:var(--ink-2)}
.rail a .dot{width:6px;height:6px;border-radius:50%;background:var(--partner-line);flex:none;margin-left:6px}
.rail a .ph{font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:.06em;padding:2px 6px;
  border-radius:20px;flex:none;margin-left:auto}
.ph1{background:var(--ph1-t);color:var(--ph1)} .ph2{background:var(--ph2-t);color:var(--ph2)}
.ph3{background:var(--ph3-t);color:var(--ph3)} .ph4{background:var(--ph4-t);color:var(--ph4)}
.toolbar .phbig{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;
  padding:5px 11px;border-radius:20px}

/* roadmap */
.rmwrap{width:100%;max-width:900px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px 26px}
.rmwrap h3{margin:0 0 4px;font-size:16px;font-weight:800;letter-spacing:-.02em}
.rmwrap .rsub{font-size:12px;color:var(--ink-2);margin:0 0 22px;max-width:66ch}
.phase{border:1px solid var(--line);border-left:5px solid var(--pc);border-radius:11px;padding:16px 18px;margin-bottom:14px;background:var(--surface)}
.phase .ptop{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap;margin-bottom:9px}
.phase .ptop b{font-size:14.5px;font-weight:800;letter-spacing:-.018em}
.phase .ptop .tag{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.09em;padding:3px 8px;border-radius:20px;background:var(--pt);color:var(--pc)}
.phase .ptop .when{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--muted-1);letter-spacing:.07em;text-transform:uppercase}
.phase p{margin:0 0 11px;font-size:13px;color:var(--ink-2);max-width:70ch}
.phase .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.phase .chips a{font-family:var(--mono);font-size:9.5px;font-weight:600;text-decoration:none;padding:4px 9px;border-radius:20px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.phase .chips a:hover{background:var(--pt);color:var(--pc);border-color:var(--pc)}
.phase .qs{margin:0;padding:0;list-style:none}
.phase .qs li{font-size:12.5px;line-height:1.55;color:var(--warn-text);background:var(--tint-warn);border-radius:9px;padding:9px 12px;margin-bottom:7px}
.phase .qs li b{color:var(--warn-text)}
.phase .qh{font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted-1);margin:0 0 7px;font-weight:600}

/* centre stage */
.stage{overflow-y:auto;padding:20px 24px 60px;display:flex;flex-direction:column;align-items:center}
.toolbar{display:flex;align-items:center;gap:8px;width:100%;max-width:920px;margin-bottom:16px;flex-wrap:wrap}
.toolbar .t{font-size:15px;font-weight:800;letter-spacing:-.02em}
.toolbar .t span{font-family:var(--mono);font-size:10px;color:var(--muted-1);font-weight:500;margin-right:7px}
.toolbar .sp{flex:1}
.tbtn{font-size:11.5px;font-weight:600;color:var(--ink-2);border:1px solid var(--line-hard);padding:7px 13px;border-radius:9px;background:var(--surface)}
.tbtn:hover{color:var(--ink)}
.tbtn.on{background:var(--brand-1);color:var(--on-brand);border-color:var(--brand-1)}
a.tbtn{text-decoration:none;display:inline-block}
a.tbtn.try{border-color:var(--ok-text);color:var(--ok-text);font-weight:700}
a.tbtn.try:hover{background:var(--tint-ok)}
[data-theme="dark"] .tbtn.on{background:var(--ok-text);color:var(--on-accent);border-color:var(--ok-text)}

/* device frames */
.phone{width:390px;background:var(--surface);border-radius:44px;padding:11px;
  box-shadow:0 2px 6px rgba(0,0,0,.10),0 24px 60px rgba(0,0,0,.20);border:1px solid var(--phone-edge)}
.screen{background:var(--canvas-screen);border-radius:34px;overflow:hidden;height:780px;display:flex;flex-direction:column;position:relative}
.desk{width:100%;max-width:900px;background:var(--surface);border-radius:14px;overflow:hidden;
  box-shadow:0 2px 6px rgba(0,0,0,.10),0 24px 60px rgba(0,0,0,.20);border:1px solid var(--phone-edge)}
.desk .chrome{display:flex;align-items:center;gap:7px;padding:11px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.desk .chrome i{width:10px;height:10px;border-radius:50%;background:var(--muted-2)}
.desk .chrome .url{margin-left:10px;flex:1;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:5px 11px;font-family:var(--mono);font-size:9.5px;color:var(--muted-1)}
.desk .dbody{padding:22px 24px 26px;background:var(--canvas-screen);min-height:520px}

/* right notes */
.notes-col{background:var(--rail);border-left:1px solid var(--line);overflow-y:auto;padding:0 0 40px}
.notes-col .nh{padding:20px 20px 13px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--rail);z-index:5}
.notes-col .nh b{font-size:13px;font-weight:800;letter-spacing:-.015em;display:block}
.notes-col .nh small{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-1);display:block;margin-top:3px}
.nlist{padding:16px 20px 0}
.nitem{font-size:12.5px;line-height:1.62;color:var(--ink-2);padding:0 0 13px;margin:0 0 13px;border-bottom:1px solid var(--line)}
.nitem:last-child{border-bottom:none}
.nitem b{color:var(--ink);font-weight:600}
.nitem.new,.nitem.q{padding:11px 13px;border-radius:11px;border-bottom:none;margin-bottom:11px}
.nitem.new{background:var(--tint-ok);color:var(--ok-text)}
.nitem.new b{color:var(--ok-text)}
.nitem.q{background:var(--tint-warn);color:var(--warn-text)}
.nitem.q b{color:var(--warn-text)}
.ntag{font-family:var(--mono);font-size:8px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;display:block;margin-bottom:4px}

/* ============================================================
   4. UI KIT (inside the device)
   ============================================================ */
.sb{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:700;padding:16px 24px 6px;flex:none;color:var(--ink)}
.body{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.hd{padding:14px 18px 0}
.hd h2{margin:0;font-size:21px;font-weight:900;letter-spacing:-.032em;color:var(--ink)}
.hd p{margin:2px 0 0;font-size:11px;color:var(--ink-2);line-height:1.45}
.abar{display:flex;align-items:center;gap:11px;padding:12px 18px 0}
.ava{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--on-brand);font-weight:800;font-size:13px;flex:none;background:var(--grad)}
.who{flex:1;min-width:0}
.who small{display:block;font-family:var(--mono);font-size:7.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who b{font-size:15.5px;font-weight:800;color:var(--ink);letter-spacing:-.018em;display:block;margin-top:1px}
.ico{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
.circ{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}

.hero{margin:14px 15px 0;border-radius:22px;padding:17px;color:var(--on-brand);position:relative;overflow:hidden;background:var(--grad);box-shadow:0 12px 30px -12px rgba(0,0,0,.4)}
.hero .wm{position:absolute;right:-30px;top:-14px;width:190px;opacity:.13;pointer-events:none}
.hero>*{position:relative;z-index:2}
.hero .lbl{font-family:var(--mono);font-size:8px;letter-spacing:.15em;text-transform:uppercase;opacity:.75}
.hero .amt{font-size:25px;font-weight:900;letter-spacing:-.035em;margin:3px 0 0;font-variant-numeric:tabular-nums;white-space:nowrap}
.hero .amt em{font-style:normal;font-size:11px;font-weight:600;opacity:.7;letter-spacing:0;margin-left:5px}
.hero .cap{font-size:10px;opacity:.82;margin-top:3px}
.hero .meter{height:5px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:13px}
.hero .meter i{display:block;height:100%;border-radius:99px;background:var(--on-brand);opacity:.95}
.hero .mrow{display:flex;justify-content:space-between;font-family:var(--mono);font-size:7.5px;letter-spacing:.09em;opacity:.75;margin-top:6px;text-transform:uppercase}

.sect{display:flex;align-items:center;justify-content:space-between;padding:17px 18px 8px}
.sect b{font-size:12px;font-weight:800;color:var(--ink);letter-spacing:-.012em}
.sect small{font-family:var(--mono);font-size:7.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted-1)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);margin:0 15px 9px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.lrow{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:11px 12px;margin:0 15px 8px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.lrow b{font-size:11.5px;font-weight:800;color:var(--ink);display:block}
.lrow small{font-size:8.5px;color:var(--muted-1);display:block;line-height:1.35;margin-top:1px}
.lrow.dash{border-style:dashed;background:transparent;box-shadow:none}
.pill{font-size:7.5px;font-weight:800;letter-spacing:.07em;padding:3px 8px;border-radius:99px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.pill.ok{background:var(--tint-ok);color:var(--ok-text)}
.pill.bad{background:var(--tint-bad);color:var(--danger-text)}
.pill.warn{background:var(--tint-warn);color:var(--warn-text)}
.pill.info{background:var(--tint-info);color:var(--ink-2)}
.pill.r{margin-left:auto}

.kv{margin:0 15px 9px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.kv div{display:flex;padding:10px 13px;border-bottom:1px solid var(--line);font-size:11px;gap:10px;align-items:center}
.kv div:last-child{border-bottom:none}
.kv .k{color:var(--muted-1);font-weight:600;flex:1}
.kv .v{color:var(--ink);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}

.note{margin:11px 15px 0;border-radius:12px;padding:10px 12px;font-size:9.5px;font-weight:600;display:flex;gap:8px;align-items:flex-start;line-height:1.5}
.note.info{background:var(--tint-info);color:var(--ink-2)}
.note.ok{background:var(--tint-ok);color:var(--ok-text)}
.note.warn{background:var(--tint-warn);color:var(--warn-text)}
.note.bad{background:var(--tint-bad);color:var(--danger-text)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:0 15px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.04);position:relative}
.tile b{font-size:11px;font-weight:800;color:var(--ink);display:block;line-height:1.3;letter-spacing:-.01em}
.tile small{font-size:8.5px;color:var(--muted-1);display:block;margin-top:2px;line-height:1.35}
.tile .disc{display:inline-block;margin-top:8px;font-family:var(--mono);font-size:14px;font-weight:600;color:var(--ok-text);letter-spacing:-.02em}
.tile .brand{font-family:var(--mono);font-size:7px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted-1);display:block}
.tile .cnr{position:absolute;top:9px;right:9px;font-size:6.5px;font-weight:800;letter-spacing:.08em;padding:2px 6px;border-radius:99px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r-btn);padding:14px;font-size:12.5px;font-weight:800;letter-spacing:-.01em;margin:0 18px}
.btn.pri{background:var(--brand-1);color:var(--on-brand)}
[data-theme="dark"] .btn.pri{background:var(--ok-text);color:var(--on-accent)}
.btn.em{background:var(--brand-4);color:var(--on-brand)}
[data-theme="dark"] .btn.em{color:var(--on-accent)}
.btn.gho{color:var(--muted-1);font-weight:600;font-size:11px;padding:9px}

.steps{display:flex;gap:5px;margin:0 18px 15px}
.steps i{flex:1;height:3.5px;border-radius:99px;background:var(--surface-2)}
.steps i.on{background:var(--brand-1)}
[data-theme="dark"] .steps i.on{background:var(--ok-text)}
.opt{display:flex;align-items:center;gap:11px;border:1.5px solid var(--line);border-radius:var(--r-card);padding:12px 13px;margin:0 18px 9px;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.opt.sel{border-color:var(--brand-1)}
[data-theme="dark"] .opt.sel{border-color:var(--ok-text)}
.opt b{font-size:12px;color:var(--ink);display:block;font-weight:800;letter-spacing:-.012em}
.opt small{font-size:8.5px;color:var(--muted-1);display:block;margin-top:2px;line-height:1.4}
.chk{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border-radius:var(--r-card);background:var(--surface);border:1px solid var(--line);margin:0 18px 8px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.chk i{width:20px;height:20px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:var(--on-brand);background:var(--brand-3);margin-top:1px;font-style:normal;font-size:11px;font-weight:800}
.chk b{font-size:11px;color:var(--ink);display:block;font-weight:800}
.chk small{font-size:8.5px;color:var(--muted-1);display:block;line-height:1.4;margin-top:1px}

/* emergency */
.embar{flex:none;background:var(--brand-4);color:var(--on-brand);padding:10px 15px;display:flex;align-items:center;gap:9px;font-size:10.5px;font-weight:800}
[data-theme="dark"] .embar{color:var(--on-accent)}
.embar .n{margin-left:auto;font-family:var(--mono);font-size:11px;letter-spacing:.05em}
.epath{display:block;margin:0 15px 10px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--ec);border-radius:var(--r-card);padding:13px 14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.epath .top{display:flex;align-items:center;gap:10px}
.epath b{font-size:12px;font-weight:800;color:var(--ink);display:block;letter-spacing:-.015em;line-height:1.25}
.epath small{font-size:8.5px;color:var(--muted-1);display:block;line-height:1.45;margin-top:7px}

/* member card */
.mcard{margin:14px 15px;border-radius:20px;padding:17px;color:var(--on-brand);position:relative;overflow:hidden;box-shadow:0 18px 40px -14px rgba(0,0,0,.5);background:var(--mc)}
.mcard .wm{position:absolute;left:-26px;bottom:-42px;width:236px;opacity:.15}
.mcard>*{position:relative;z-index:2}
.mcard .chip{width:32px;height:24px;border-radius:5px;background:var(--chip);position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.mcard .chip::after{content:"";position:absolute;inset:4px 6px;border:1px solid rgba(0,0,0,.22);border-radius:2px}
.mcard .no{font-family:var(--mono);font-size:13px;letter-spacing:.13em;margin-top:14px}
.mcard .nm{font-weight:800;font-size:12.5px;letter-spacing:.02em}
.mcard .meta{font-family:var(--mono);font-size:7.5px;opacity:.75;margin-top:2px}
.mcard .qr{background:var(--qr-quiet);border-radius:10px;padding:7px;display:inline-block;line-height:0}
.stp{display:inline-flex;align-items:center;gap:5px;font-size:8.5px;font-weight:800;padding:4px 10px;border-radius:99px;letter-spacing:.08em;background:rgba(255,255,255,.18);color:var(--on-brand);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}

/* tabbar */
.tabbar{flex:none;display:flex;background:var(--tabbar);border-top:1px solid var(--line);padding:7px 3px 4px}
.tabbar span{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:8px;font-weight:700;padding:5px 0 4px;color:var(--muted-1);letter-spacing:.01em}
.tabbar span.on{color:var(--brand-1)}
[data-theme="dark"] .tabbar span.on{color:var(--ok-text)}
.tabbar span.em.on{color:var(--brand-4)}
.hbar{flex:none;display:flex;justify-content:center;padding:3px 0 9px;background:var(--tabbar)}
.hbar i{width:116px;height:5px;border-radius:99px;background:var(--ink);opacity:.75}

/* dark-chrome screens (coach) */
.screen.dk .tabbar span.on{color:var(--sp-rugby)}
.screen.dk{--surface:var(--coach-surface);--canvas-screen:var(--coach-canvas);--line:rgba(255,255,255,.09);
  --ink:var(--coach-ink);--ink-2:var(--coach-ink-2);--muted-1:var(--coach-muted);
  --tabbar:rgba(14,23,19,.97);--surface-2:var(--coach-surface-2)}

/* ============================================================
   5. INTEGRATION MARKER (§10)
   ============================================================ */
.ix-band{border:1.5px dashed var(--ixc,var(--partner-line));border-radius:calc(var(--r-card) + 3px);
  padding:3px;position:relative;margin:14px 12px 0}
.ix-band::before{content:attr(data-ix);position:absolute;top:-8px;right:12px;
  background:var(--ixc,var(--partner-line));color:var(--on-brand);font-size:7.5px;font-weight:800;
  letter-spacing:.12em;padding:2px 7px;border-radius:20px}
[data-theme="dark"] .ix-band::before{color:var(--on-accent)}
.ix-band>*{margin-left:0;margin-right:0}

/* oneplan hosted chrome */
.ophost{background:var(--surface-2)}
.ophead{background:var(--partner-line);color:var(--on-brand);padding:13px 16px}
[data-theme="dark"] .ophead{color:var(--on-accent)}
.ophead .url{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);border-radius:8px;padding:6px 10px;font-family:var(--mono);font-size:8.5px}
.ophead .t{font-weight:800;font-size:13px;margin-top:10px;letter-spacing:-.015em}
.ophead .s{font-size:9px;opacity:.85;margin-top:1px}
.opbox{margin:12px 15px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.opbox h5{margin:0 0 6px;font-size:11.5px;font-weight:800;color:var(--ink)}
.opbox p{margin:0;font-size:9.5px;color:var(--ink-2);line-height:1.55}
.opck{display:flex;gap:9px;align-items:flex-start;margin-top:10px;font-size:9px;color:var(--ink-2);line-height:1.5}
.opck i{width:16px;height:16px;border-radius:4px;background:var(--partner-line);color:var(--on-brand);display:flex;align-items:center;justify-content:center;flex:none;font-style:normal;margin-top:1px;font-size:10px;font-weight:800}
[data-theme="dark"] .opck i{color:var(--on-accent)}

/* desk widgets */
.dstat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.dstat div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 16px}
.dstat b{font-family:var(--mono);font-size:22px;font-weight:600;display:block;letter-spacing:-.025em;font-variant-numeric:tabular-nums;color:var(--ink)}
.dstat small{font-family:var(--mono);font-size:9.5px;color:var(--muted-1);letter-spacing:.07em;text-transform:uppercase}
.dstat em{font-style:normal;font-size:10.5px;color:var(--ok-text);display:block;margin-top:4px}
table.g{width:100%;border-collapse:collapse;font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.g th{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-1);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
table.g td{padding:9px 12px;border-bottom:1px solid var(--line);color:var(--ink)}
table.g tr:last-child td{border-bottom:none}
h3.dh{font-size:12.5px;font-weight:800;margin:22px 0 10px;color:var(--ink);display:flex;align-items:baseline;gap:9px}
h3.dh span{font-family:var(--mono);font-size:8.5px;color:var(--muted-1);letter-spacing:.11em;text-transform:uppercase;font-weight:500}
.sbar{height:24px;border-radius:8px;display:flex;overflow:hidden;margin:9px 0 8px}
.sbar i{display:block}
.leg{display:flex;gap:15px;flex-wrap:wrap;font-size:11px;color:var(--ink-2)}
.leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}

/* ============================================================
   6. FLOW MAP
   ============================================================ */
.flowwrap{width:100%;max-width:900px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px 26px}
.flowwrap h3{margin:0 0 4px;font-size:16px;font-weight:800;letter-spacing:-.02em}
.flowwrap .fsub{font-size:12px;color:var(--ink-2);margin:0 0 20px;max-width:64ch}
.lane{margin-bottom:20px}
.lane .ln{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted-1);margin-bottom:9px;font-weight:600}
.nodes{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.node{flex:1;min-width:128px;max-width:190px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:10px 11px;position:relative;text-decoration:none;color:inherit;display:block}
.node b{font-size:11px;font-weight:700;display:block;line-height:1.3;color:var(--ink)}
.node small{font-size:9px;color:var(--muted-1);display:block;margin-top:3px;line-height:1.35}
.node .lk{font-family:var(--mono);font-size:8px;color:var(--partner-line);letter-spacing:.08em;display:block;margin-top:5px;font-weight:600}
.node.new{background:var(--tint-ok);border-color:var(--ok-text)}
.node.gap{background:var(--tint-bad);border-color:var(--danger-text)}
.node.partner{background:var(--tint-soccer);border-color:var(--partner-line)}
.node .badge{position:absolute;top:-7px;left:9px;font-family:var(--mono);font-size:7px;font-weight:800;letter-spacing:.11em;padding:2px 6px;border-radius:20px;color:var(--on-brand)}
.node.new .badge{background:var(--ok-text)}
.node.gap .badge{background:var(--danger-text)}
.node.partner .badge{background:var(--partner-line)}
[data-theme="dark"] .node .badge{color:var(--on-accent)}
.flegend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--ink-2);margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.flegend span{display:flex;align-items:center;gap:6px}
.flegend i{width:11px;height:11px;border-radius:3px;border:1px solid var(--line)}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail"></nav>
  <div class="stage">
    <div class="toolbar">
      <div class="t" id="stitle"></div>
      <span class="sp"></span>
      <a class="tbtn try" id="tTry" hidden>Try this flow &rarr;</a>
      <button class="tbtn" id="tRoad">Roadmap</button>
      <button class="tbtn" id="tFlow">Flow map</button>
      <button class="tbtn" id="tTheme">Dark</button>
    </div>
    <div id="stageBody"></div>
  </div>
  <aside class="notes-col" id="notes"></aside>
</div>

<script>
/* ============================================================
   THEME TOGGLE (§11)
   ============================================================ */
(function(){
  const btn=document.getElementById('tTheme'), root=document.documentElement;
  const set=m=>{
    if(m==='dark'){root.setAttribute('data-theme','dark');btn.textContent='Light';btn.classList.add('on');}
    else{root.removeAttribute('data-theme');btn.textContent='Dark';btn.classList.remove('on');}
    try{localStorage.setItem('mf-theme',m)}catch(e){}
  };
  let m='light'; try{m=localStorage.getItem('mf-theme')||'light'}catch(e){}
  set(m);
  btn.addEventListener('click',()=>set(root.hasAttribute('data-theme')?'light':'dark'));
})();

/* ============================================================
   FORMATTERS (§9) — South African conventions: R 1 799,00
   ============================================================ */
/* South African convention: R 1 799,00 - space for thousands, comma for decimals.
   Built from formatToParts so each piece is replaced by its ROLE. Swapping by
   character breaks the moment the runtime's en-ZA data already uses those
   separators, which is exactly what happened here. */
const _fmt = (n, dp) => new Intl.NumberFormat('en-ZA',{minimumFractionDigits:dp,maximumFractionDigits:dp})
  .formatToParts(n).map(x => x.type==='group' ? ' ' : x.type==='decimal' ? ',' : x.value).join('');
const money = n => 'R ' + _fmt(n, 2);
const rnd   = n => 'R ' + _fmt(Math.round(n), 0);
const pctf = n => n + '%';

/* ============================================================
   ICONS + FIELD OUTLINES
   ============================================================ */
const I={
user:'<circle cx="12" cy="8" r="3.8"/><path d="M4.5 20.5c0-4.1 3.4-7.5 7.5-7.5s7.5 3.4 7.5 7.5"/>',
shield:'<path d="M12 3.2 19 6v5.1c0 4.8-3.3 7.7-7 9.7-3.7-2-7-4.9-7-9.7V6z"/><path d="m9.2 11.8 2 2 3.8-3.9"/>',
siren:'<path d="M6 18.5v-5a6 6 0 0 1 12 0v5"/><path d="M4 18.5h16v2.5H4z"/><path d="M12 3v2M5 6.5 6.5 8M19 6.5 17.5 8"/>',
bag:'<path d="M5.5 8h13l-1 12.5H6.5z"/><path d="M9 8V5.8a3 3 0 0 1 6 0V8"/>',
more:'<circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/>',
card:'<rect x="2.8" y="5" width="18.4" height="14" rx="3"/><path d="M2.8 9.8h18.4"/>',
hospital:'<path d="M4 20.5V8.5l8-5 8 5v12"/><path d="M10.2 11h3.6v2.2h2.2v3.6h-2.2V19h-3.6v-2.2H8v-3.6h2.2z"/>',
ambulance:'<path d="M2.5 16.5V9h11v7.5"/><path d="M13.5 11h4l4 3.2v2.3h-8z"/><circle cx="6.5" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/>',
brain:'<path d="M9.5 4.5a3 3 0 0 0-3 3 2.6 2.6 0 0 0-1 4.6 3 3 0 0 0 1.6 5.2 2.8 2.8 0 0 0 2.4 2.2V4.5z"/><path d="M14.5 4.5a3 3 0 0 1 3 3 2.6 2.6 0 0 1 1 4.6 3 3 0 0 1-1.6 5.2 2.8 2.8 0 0 1-2.4 2.2V4.5z"/>',
phone:'<path d="M7 3.5h2.8l1.5 4.2-2.1 1.6a12.8 12.8 0 0 0 5.5 5.5l1.6-2.1 4.2 1.5V17a2.6 2.6 0 0 1-2.7 2.6A15.4 15.4 0 0 1 4.4 6.2 2.6 2.6 0 0 1 7 3.5z"/>',
chev:'<path d="m9.5 6 6 6-6 6"/>', plus:'<path d="M12 5v14M5 12h14"/>',
bell:'<path d="M12 4a5.5 5.5 0 0 1 5.5 5.5c0 4 1.4 5.4 2 6H4.5c.6-.6 2-2 2-6A5.5 5.5 0 0 1 12 4z"/><path d="M10 19a2 2 0 0 0 4 0"/>',
doc:'<path d="M7 3.5h7l4 4V20a.9.9 0 0 1-.9.9H7a.9.9 0 0 1-.9-.9V4.4A.9.9 0 0 1 7 3.5z"/><path d="M13.6 3.8v4h4"/><path d="M9.5 12.5h5M9.5 15.8h5"/>',
scan:'<path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><path d="M4 12h16"/>',
lock:'<rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>',
info:'<circle cx="12" cy="12" r="9"/><path d="M12 8.5v5M12 16.8v.2"/>',
clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3.2 2"/>',
crown:'<path d="M4 8.5 8 12l4-6 4 6 4-3.5-1.5 10h-13z"/>',
boot:'<path d="M4 15.5h5l1.5-3h4l1.5 3h5"/><path d="M6 15.5V19h12v-3.5"/>',
flask:'<path d="M9 3.5h6v5l4 9.5a1.6 1.6 0 0 1-1.5 2.5H6.5A1.6 1.6 0 0 1 5 18z"/><path d="M9 8.5h6"/>',
guard:'<path d="M8 4v9a4 4 0 0 0 8 0V4"/><path d="M6 4h4M14 4h4"/>',
shirt:'<path d="M8.5 4 5 6v5h2.5v9.5h9V11H19V6l-3.5-2z"/><path d="M8.5 4a3.5 3.5 0 0 0 7 0"/>',
physio:'<path d="M6.5 20.5V14a5.5 5.5 0 0 1 11 0v6.5"/><path d="M9 8.5V6a3 3 0 0 1 6 0v2.5"/><path d="M4 20.5h16"/>',
gift:'<rect x="4" y="9.5" width="16" height="4" rx="1"/><path d="M5.5 13.5V19a1.5 1.5 0 0 0 1.5 1.5h10a1.5 1.5 0 0 0 1.5-1.5v-5.5M12 9.5v11"/>',
users:'<circle cx="9" cy="8" r="3.4"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 5.2a3.4 3.4 0 0 1 0 5.6M18 20c0-2.3-.9-4.4-2.3-5.9"/>',
home:'<path d="M3.5 10.8 12 3.5l8.5 7.3"/><path d="M5.5 9.2V20a1 1 0 0 0 1 1H10v-6.2h4V21h3.5a1 1 0 0 0 1-1V9.2"/>'
};
const ic=(n,s=19,w=1.85,c='currentColor')=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex:none">${I[n]}</svg>`;

const FIELD={
 rugby:['0 0 400 233','<rect x="1.5" y="1.5" width="397" height="230"/><line x1="33" y1="1.5" x2="33" y2="231.5"/><line x1="367" y1="1.5" x2="367" y2="231.5"/><line x1="200" y1="1.5" x2="200" y2="231.5"/><line x1="107" y1="1.5" x2="107" y2="231.5"/><line x1="293" y1="1.5" x2="293" y2="231.5"/>'],
 soccer:['0 0 400 259','<rect x="1.5" y="1.5" width="397" height="256"/><line x1="200" y1="1.5" x2="200" y2="257.5"/><circle cx="200" cy="129.5" r="35"/><rect x="1.5" y="52.8" width="61.5" height="153.5"/><rect x="337" y="52.8" width="61.5" height="153.5"/>'],
 hockey:['0 0 400 241','<rect x="1.5" y="1.5" width="397" height="238"/><line x1="200" y1="1.5" x2="200" y2="239.5"/><line x1="100" y1="1.5" x2="100" y2="239.5"/><line x1="300" y1="1.5" x2="300" y2="239.5"/><path d="M1.5 48.5 A64 64 0 0 1 64 112.5 L64 128.5 A64 64 0 0 1 1.5 192.5"/><path d="M398.5 48.5 A64 64 0 0 0 336 112.5 L336 128.5 A64 64 0 0 0 398.5 192.5"/>'],
 netball:['0 0 400 200','<rect x="1.5" y="1.5" width="397" height="197"/><line x1="133.3" y1="1.5" x2="133.3" y2="198.5"/><line x1="266.7" y1="1.5" x2="266.7" y2="198.5"/><circle cx="200" cy="100" r="12"/><path d="M1.5 35.7 A64.3 64.3 0 0 1 1.5 164.3"/><path d="M398.5 35.7 A64.3 64.3 0 0 0 398.5 164.3"/>']
};
const field=(c,o={})=>`<svg viewBox="${FIELD[c][0]}" ${o.w?`width="${o.w}" height="${o.h}"`:'style="width:100%;height:auto"'} fill="none" stroke="${o.stroke||'currentColor'}" stroke-width="${o.sw||2.4}" stroke-linecap="round" style="display:block">${FIELD[c][1]}</svg>`;
const SPT={rugby:'--sp-rugby',soccer:'--sp-soccer',hockey:'--sp-hockey',netball:'--sp-netball'};
const SPTINT={rugby:'--tint-rugby',soccer:'--tint-soccer',hockey:'--tint-hockey',netball:'--tint-netball'};
const SPCARD={rugby:'--card-rugby',soccer:'--card-soccer',hockey:'--card-hockey',netball:'--card-netball'};
const spc=k=>`var(${SPT[k]})`, spt=k=>`var(${SPTINT[k]})`, spcard=k=>`var(${SPCARD[k]})`;

/* ============================================================
   UI KIT (§7) — screens are composed, never hand-written
   ============================================================ */
/* sb() opens the .body scroll container. Every phone screen closes it with the
   </div> immediately before tabbar(). Without this, content below the fold is
   clipped by .screen{overflow:hidden} and the tab bar floats mid-screen. */
const sb    = (t,cls='',style='') => `<div class="sb"><span>${t||'07:42'}</span><span>5G &#9646;&#9646;&#9646;</span></div><div class="body ${cls}"${style?` style="${style}"`:''}>`;
const hd    = (h,p) => `<div class="hd"><h2>${h}</h2>${p?`<p>${p}</p>`:''}</div>`;
const abar  = (ini,eyebrow,name,badge) => `<div class="abar"><span class="ava">${ini}</span>
  <span class="who"><small>${eyebrow}</small><b>${name}</b></span>
  <span class="circ">${ic('bell',18)}${badge?`<span style="position:absolute"></span>`:''}</span></div>`;
const hero  = (lbl,amt,unit,cap,pctv,l,r,wmCode) => `<div class="hero">
  ${wmCode?`<div class="wm">${field(wmCode,{stroke:'var(--on-brand)',sw:4})}</div>`:''}
  <span class="stp" style="position:absolute;top:16px;right:16px;z-index:3">&#9679; ACTIVE</span>
  <div style="padding-right:80px"><span class="lbl">${lbl}</span>
  <div class="amt num">${amt}<em>${unit}</em></div></div>
  <div class="cap">${cap}</div>
  <div class="meter"><i style="width:${pctv}%"></i></div>
  <div class="mrow"><span>${l}</span><span>${r}</span></div></div>`;
const sect  = (b,s) => `<div class="sect"><b>${b}</b><small>${s||''}</small></div>`;
const lrow  = (icoHtml,bg,fg,title,sub,right,extra) => `<div class="lrow ${extra||''}">
  <span class="ico" style="background:${bg};color:${fg}">${icoHtml}</span>
  <span style="flex:1;min-width:0"><b>${title}</b>${sub?`<small>${sub}</small>`:''}</span>${right||''}</div>`;
const pill  = (t,s) => `<span class="pill ${s} r">${t}</span>`;
const kv    = rows => `<div class="kv">${rows.map(([k,v,c])=>`<div><span class="k">${k}</span><span class="v"${c?` style="color:${c}"`:''}>${v}</span></div>`).join('')}</div>`;
const note  = (s,txt) => `<div class="note ${s}">${ic('info',13,2.1)}<span>${txt}</span></div>`;
const btn   = (t,s) => `<div class="btn ${s||'pri'}">${t}</div>`;
const steps = (n,a) => `<div class="steps">${Array.from({length:n},(_,i)=>`<i class="${i<a?'on':''}"></i>`).join('')}</div>`;
const opt   = (icoHtml,bg,fg,b,s,sel) => `<div class="opt ${sel?'sel':''}">

/* tile: threshold logic lives in the helper, not the caller (§7) */
const tile  = (icoHtml,bg,fg,brand,name,pct,cnr) => {
  const cls = pct>=15?'ok':pct>=12?'info':'warn';
  return `<div class="tile">${cnr?`<span class="cnr pill ${cnr[1]}" style="margin:0">${cnr[0]}</span>`:''}
   <span class="ico" style="background:${bg};color:${fg};margin-bottom:8px">${icoHtml}</span>
   <span class="brand">${brand}</span><b>${name}</b>
   <span class="disc num">${pctf(pct)} off</span>
   <small>member price &middot; <span class="pill ${cls}" style="padding:1px 5px">${cls==='ok'?'best':cls==='info'?'good':'std'}</span></small></div>`;
};
const tabbar = (items,active) => `<div class="tabbar">${items.map(([k,i,l],n)=>

  M6:'parent&t=oneplan',   M7:'parent&t=emergency', M8:'parent&t=emergency',

const byApp = SCREENS.reduce((m,s)=>{(m[s.app]=m[s.app]||[]).push(s);return m},{});

function renderRail(activeId){
  document.getElementById('rail').innerHTML =
   `<div class="brand"><b>MatchFit</b><small>Scoping demo &middot; v1</small></div>` +
   Object.entries(byApp).map(([app,list])=>
     `<h4>${app}</h4>` + list.map(s=>
       `<a href="#${s.id}" class="${s.id===activeId?'on':''}"><span class="sid">${s.id}</span><span>${s.name}</span><span class="ph ph${s.phase}">P${s.phase}</span>${s.ix?'<span class="dot" title="integration point"></span>':''}</a>`).join('')
   ).join('') +
   `<h4>The plan</h4>`+
   `<a href="#ROADMAP" class="${activeId==='ROADMAP'?'on':''}"><span class="sid">&#9776;</span><span>Roadmap</span></a>`+
   `<a href="#FLOW" class="${activeId==='FLOW'?'on':''}"><span class="sid">&#9673;</span><span>Flow map</span></a>`;

function renderNotes(s){
  const el=document.getElementById('notes');
  if(s==='ROADMAP'){
    el.innerHTML=`<div class="nh"><b>Roadmap</b><small>The plan &middot; 4 phases</small></div>
     <div class="nlist">
      <div class="nitem"><b>Phase 1 is deliberately small.</b> One job: onboard a policyholder and hand the application to Oneplan. Proving that at a live tournament is worth more than a feature-complete app nobody has sold through.</div>
      <div class="nitem new"><span class="ntag">Why this order</span>Each phase earns the next. Onboarding proves the API and the appetite. Schools prove the distribution. Only then does the shop have an audience worth selling to.</div>
      <div class="nitem q"><span class="ntag">What blocks scoping today</span>The Oneplan onboarding payload and the premium collection mechanism. Both are Phase 1, both sit on Oneplan&rsquo;s side, and <b>neither can be estimated from the outside</b>. Everything else in this plan can be priced once those two are documented.</div>
      <div class="nitem">Every phase links to its screens. Click a chip to open the screen and read its spec.</div>
     </div>`;
    return;
  }
  if(!s){el.innerHTML=`<div class="nh"><b>Flow map</b><small>Process &middot; 6 lanes</small></div>
    <div class="nlist">
      <div class="nitem">Every path a member, coach or partner can take. Nodes link to the screen behind them where one exists.</div>
      <div class="nitem q"><span class="ntag">Open question</span>Four of the six red gap nodes sit in <b>Path D</b>. The catastrophic pathway is the least designed and the most consequential part of the product. It should not ship in phase 1 with a placeholder workflow.</div>
      <div class="nitem q"><span class="ntag">Open question</span><b>Path B has a gap at the facility directory.</b> Nobody owns a hospital list tagged for casualty, ICU and trauma capability. Wrong data there sends a child to the wrong hospital, so it gates pathways 1 and 2 both.</div>
      <div class="nitem"><b>Path E is the commercial engine.</b> On the revised model rewards is roughly 60% of revenue by year three, and the platform fee never covers running costs on its own.</div>
    </div>`;return}
  el.innerHTML=`<div class="nh"><b>${s.name}</b><small>${s.id} &middot; ${s.app}${s.ix?' &middot; integration':''}</small></div>
   <div class="nlist">${(s.notes||[]).map(n=>{
     if(Array.isArray(n)){
       const k=n[0]==='new'?'new':'q';
       return `<div class="nitem ${k}"><span class="ntag">${k==='new'?'New in this build':'Open question'}</span>${n[1]}</div>`;
     }
     return `<div class="nitem">${n}</div>`;
   }).join('')}</div>`;
}

function renderFlow(){
  return `<div class="flowwrap">
   <h3>Process map</h3>
   <p class="fsub">Six paths. Green is new in this build, red is a known gap or risk, blue belongs to another system. Click any node with a screen ID to open it.</p>
   ${FLOW.map(l=>`<div class="lane"><div class="ln">${l.ln}</div><div class="nodes">
     ${l.nodes.map(([label,sub,sid,style])=>{
       const cls=style?` ${style}`:'', badge=style?`<span class="badge">${style==='new'?'NEW':style==='gap'?'GAP':'PARTNER'}</span>`:'';
       const inner=`${badge}<b>${label}</b>${sub?`<small>${sub}</small>`:''}${sid?`<span class="lk">&rarr; ${sid}</span>`:''}`;
       return sid?`<a class="node${cls}" href="#${sid}">${inner}</a>`:`<div class="node${cls}">${inner}</div>`;
     }).join('')}
   </div></div>`).join('')}
   <div class="flegend">
     <span><i style="background:var(--surface-2)"></i>Exists today</span>
     <span><i style="background:var(--tint-ok);border-color:var(--ok-text)"></i>New in this build</span>
     <span><i style="background:var(--tint-bad);border-color:var(--danger-text)"></i>Known gap or risk</span>
     <span><i style="background:var(--tint-soccer);border-color:var(--partner-line)"></i>Another system</span>
   </div>
  </div>`;
}

function route(){
  const id=(location.hash||'#M1').slice(1);
  const stage=document.getElementById('stageBody'), title=document.getElementById('stitle');
  if(id==='ROADMAP'){
    title.innerHTML=`<span>&#9776;</span>Roadmap`;
    stage.innerHTML=renderRoadmap(); renderRail('ROADMAP'); renderNotes('ROADMAP');
    document.getElementById('tRoad').classList.add('on');
    document.getElementById('tFlow').classList.remove('on');
    document.getElementById('tTry').hidden=true;
    window.scrollTo(0,0); return;
  }
  document.getElementById('tRoad').classList.remove('on');
  if(id==='FLOW'){
    title.innerHTML=`<span>&#9673;</span>Flow map`;
    stage.innerHTML=renderFlow(); renderRail('FLOW'); renderNotes(null);
    document.getElementById('tFlow').classList.add('on');
    document.getElementById('tTry').hidden=true;
    window.scrollTo(0,0); return;
  }
  document.getElementById('tFlow').classList.remove('on');
  const s=SCREENS.find(x=>x.id===id)||SCREENS[0];
  title.innerHTML=`<span>${s.id}</span>${s.name} <span class="phbig ph${s.phase}">PHASE ${s.phase}</span>`;
  const tryBtn=document.getElementById('tTry');
  if(TRY[s.id]){ tryBtn.href=`../app/?p=${TRY[s.id]}&skip=1&from=${s.id}`; tryBtn.hidden=false; }
  else { tryBtn.hidden=true; }
  stage.innerHTML = s.frame==='desk'
    ? `<div class="desk"><div class="chrome"><i></i><i></i><i></i><div class="url">app.matchfit.co.za/${s.id.toLowerCase()}</div></div><div class="dbody">${s.html()}</div></div>`
    : `<div class="phone"><div class="screen${s.dark?' dk':''}">${s.html()}</div></div>`;
  renderRail(s.id); renderNotes(s);
}
addEventListener('hashchange',route);
document.getElementById('tFlow').addEventListener('click',()=>{location.hash='#FLOW'});
document.getElementById('tRoad').addEventListener('click',()=>{location.hash='#ROADMAP'});
route();
</script>
