<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MatchFit Platform Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0F1013; --panel:#181A1F; --panel2:#20232A; --ink:#ECEEF1; --ink2:#979BA4; --ink3:#63676F;
  --line:#282B32; --brass:#D2A24C;
  --brand:#151C25; --brand2:#22303F; --paper:#F4F7F9;
  --t1:#111823; --t2:#4F5966; --t3:#8A929E; --hair:rgba(17,24,35,.09);
  --ok:#1D9A66; --bad:#C0392B; --amber:#B5761A;
  --rugby:#17643E; --rugby-t:#E6F0EA;
  --soccer:#22499E; --soccer-t:#E7EDF8;
  --hockey:#0C7B80; --hockey-t:#E2F1F1;
  --netball:#C2631F; --netball-t:#FAEDE2;
  --op:#1B3C8C;
  --sh-s:0 1px 2px rgba(12,18,28,.05),0 1px 3px rgba(12,18,28,.04);
  --sh-m:0 1px 2px rgba(12,18,28,.05),0 10px 26px -14px rgba(12,18,28,.2);
  --sh-l:0 2px 5px rgba(12,18,28,.07),0 22px 46px -18px rgba(12,18,28,.4);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Archivo,system-ui,sans-serif;line-height:1.55;min-height:100vh}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0;text-align:left}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:6px}
svg.ic{display:block;flex:none}

.shell{max-width:1560px;margin:0 auto;padding:20px 26px 90px}
.topbar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding:6px 0 18px;border-bottom:1px solid var(--line);margin-bottom:30px}
.logo{font-weight:900;letter-spacing:-.03em;font-size:17px}
.logo small{display:block;font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.15em;color:var(--brass);text-transform:uppercase;font-weight:500;margin-top:1px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:8px 14px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--ink2);transition:.15s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line),0 2px 6px rgba(0,0,0,.25)}
.spacer{flex:1}
.tbtn{font-size:11.5px;color:var(--ink3);border:1px solid var(--line);padding:8px 13px;border-radius:9px;transition:.15s}
.tbtn:hover{color:var(--ink);border-color:var(--ink3)}
.stage{display:flex;gap:28px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.phonewrap{position:relative;flex:none}
.glow{position:absolute;inset:-60px -80px;border-radius:50%;filter:blur(70px);opacity:.15;pointer-events:none}
.foot{width:100%;text-align:center;font-size:10.5px;color:var(--ink3);line-height:1.6;max-width:820px;margin:8px auto 0;padding-top:14px;border-top:1px solid var(--line)}
.notes{width:288px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;font-size:12.5px;color:var(--ink2)}
.notes h4{margin:0 0 10px;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--brass);font-family:"IBM Plex Mono",monospace;font-weight:600}
.notes ul{margin:0;padding-left:16px}
.notes li{margin-bottom:8px;line-height:1.5}
.notes .flag{margin-top:12px;padding:10px 12px;border-radius:10px;background:rgba(210,162,76,.09);border:1px solid rgba(210,162,76,.3);color:var(--brass);font-size:11.5px;line-height:1.5}
.notes .disc{margin-top:13px;padding-top:12px;border-top:1px solid var(--line);font-size:10.5px;color:var(--ink3);line-height:1.55}

.phone{position:relative;width:326px;height:716px;border-radius:48px;background:linear-gradient(160deg,#3a3d45,#181A1F 32%);padding:11px;box-shadow:0 36px 78px -26px rgba(0,0,0,.85),0 0 0 1px #383B43,inset 0 0 0 1.5px #52555C;flex:none}
.phone::before{content:"";position:absolute;left:-2.5px;top:150px;width:3px;height:62px;border-radius:2px;background:#494c54}
.phone::after{content:"";position:absolute;right:-2.5px;top:186px;width:3px;height:88px;border-radius:2px;background:#494c54}
.scr{position:relative;width:100%;height:100%;border-radius:38px;overflow:hidden;display:flex;flex-direction:column;background:var(--sc,#fff)}
.island{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:90px;height:24px;background:#000;border-radius:13px;z-index:60}
.island::after{content:"";position:absolute;right:8px;top:7px;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#1e2f4a,#000 70%)}
.sb{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:700;padding:15px 24px 5px;flex:none}
.body{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.scr[data-scrolls]::after{content:"";position:absolute;left:0;right:0;bottom:74px;height:30px;pointer-events:none;z-index:25;background:linear-gradient(to top,var(--sc),transparent)}
.view{animation:rise .28s cubic-bezier(.2,.7,.3,1)}
@keyframes rise{from{transform:translateY(9px)}to{transform:none}}
@keyframes pop{from{transform:scale(.96) translateY(12px)}to{transform:none}}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}

/* 5-tab bar */
.tabbar{flex:none;display:flex;background:rgba(255,255,255,.97);border-top:1px solid var(--hair);padding:6px 3px 3px}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:8px;font-weight:700;padding:6px 0 4px;color:#9aa0ab;border-radius:11px;transition:.15s;letter-spacing:.01em}
.tabbar button:active{transform:scale(.93)}
.homebar{flex:none;display:flex;justify-content:center;padding:2px 0 8px;background:rgba(255,255,255,.97)}
.homebar i{width:116px;height:5px;border-radius:99px;background:#1c2027;opacity:.8}
.dark .tabbar,.dark .homebar{background:rgba(14,23,19,.97);border-top-color:rgba(255,255,255,.07)}
.dark .homebar i{background:#e6efe9;opacity:.55}

/* shared */
.hd{padding:14px 18px 0}
.hd h2{margin:0;font-size:20px;font-weight:900;letter-spacing:-.032em;color:var(--t1)}
.hd p{margin:1px 0 0;font-size:10.5px;color:var(--t2);line-height:1.45}
.appbar{display:flex;align-items:center;gap:11px;padding:10px 18px 0}
.ava{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;flex:none}
.who{flex:1;min-width:0}
.who small{display:block;font-family:"IBM Plex Mono",monospace;font-size:7.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who b{font-size:15.5px;font-weight:800;color:var(--t1);letter-spacing:-.018em;display:block;margin-top:1px}
.bell{width:38px;height:38px;border-radius:50%;background:#fff;border:1px solid var(--hair);display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-s);position:relative;flex:none}
.bell .bd{position:absolute;top:7px;right:8px;min-width:15px;height:15px;padding:0 3px;border-radius:99px;background:#C0392B;border:1.5px solid #fff;color:#fff;font-size:8.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.sect{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px}
.sect b{font-size:12px;font-weight:800;color:var(--t1);letter-spacing:-.012em}
.sect small{font-family:"IBM Plex Mono",monospace;font-size:7.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--t3)}
.row{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--hair);border-radius:16px;padding:11px 12px;box-shadow:var(--sh-s);margin:0 15px 8px;width:calc(100% - 30px);transition:.15s}
.row:active{transform:scale(.985)}
.row .ri{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
.row b{font-size:11.5px;font-weight:800;color:var(--t1);display:block}
.row small{font-size:8.5px;color:var(--t3);display:block;line-height:1.35;margin-top:1px}
.row .pil{margin-left:auto;font-size:7.5px;font-weight:800;letter-spacing:.07em;padding:3px 8px;border-radius:99px;white-space:nowrap}
.pil.g{background:#E7F5EC;color:#14764D}.pil.r{background:#FAE7E6;color:#B3202C}
.pil.n{background:#E9EDF1;color:#4F5966}.pil.a{background:#FBF0DD;color:#8A6210}
.pil.p2{background:#EFEAF6;color:#5B4A94}
.chev{margin-left:auto;color:#C2C7D0}
.notice{margin:11px 15px 0;border-radius:13px;padding:9px 12px;font-size:9px;font-weight:600;display:flex;gap:8px;align-items:flex-start;line-height:1.45}
.kv{margin:0 15px 8px;background:#fff;border:1px solid var(--hair);border-radius:16px;box-shadow:var(--sh-s);overflow:hidden}
.kv div{display:flex;padding:10px 13px;border-bottom:1px solid var(--hair);font-size:10.5px;gap:10px}
.kv div:last-child{border-bottom:none}
.kv span.k{color:var(--t3);font-weight:600;flex:none;width:88px}
.kv span.v{color:var(--t1);font-weight:600;text-align:right;margin-left:auto}
.btnP{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:16px;padding:14px;font-size:13px;font-weight:800;color:#fff;box-shadow:var(--sh-m);transition:.15s;letter-spacing:-.01em}
.btnP:active{transform:scale(.98)}
.btnP:disabled{background:#c9cdd6!important;box-shadow:none;cursor:not-allowed}
.btnG{display:block;width:100%;margin-top:10px;font-size:11px;font-weight:600;color:var(--t3);padding:8px;text-align:center}
.toast{position:absolute;left:14px;right:14px;top:52px;z-index:90;background:rgba(18,22,32,.97);color:#fff;border-radius:16px;padding:12px 15px;font-size:10.5px;font-weight:600;box-shadow:0 16px 40px rgba(0,0,0,.45);opacity:0;transform:translateY(-14px);transition:.3s cubic-bezier(.2,.8,.3,1);pointer-events:none;line-height:1.5;display:flex;gap:9px;align-items:flex-start}
.toast.show{opacity:1;transform:none}
.backrow{display:flex;align-items:center;gap:10px;padding:14px 18px 2px}
.backrow button{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--t2)}

/* cover card */
.cover{margin:13px 15px 0;border-radius:22px;padding:16px 17px 15px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--sh-l)}
.cover .wm{position:absolute;right:-32px;top:-16px;width:196px;opacity:.13;pointer-events:none}
.cover>*{position:relative;z-index:2}
.cover .lbl{font-family:"IBM Plex Mono",monospace;font-size:8px;letter-spacing:.15em;text-transform:uppercase;opacity:.72}
.cover .amt{font-size:24px;font-weight:900;letter-spacing:-.033em;margin:2px 0 0;font-variant-numeric:tabular-nums;white-space:nowrap}
.cover .amt small{font-size:10.5px;font-weight:600;opacity:.7;letter-spacing:0;margin-left:5px}
.cover .who2{font-size:10px;opacity:.8;margin-top:3px}
.cover .meter{height:4.5px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:12px}
.cover .meter i{display:block;height:100%;border-radius:99px;background:#fff;opacity:.94;transition:width .5s}
.cover .mrow{display:flex;justify-content:space-between;font-family:"IBM Plex Mono",monospace;font-size:7.5px;letter-spacing:.09em;opacity:.72;margin-top:5px;text-transform:uppercase}
.stp{display:inline-flex;align-items:center;gap:5px;font-size:8.5px;font-weight:800;padding:4px 10px;border-radius:99px;letter-spacing:.08em}
.stp i{width:5.5px;height:5.5px;border-radius:50%;background:currentColor;animation:pulseDot 2.2s infinite}
.stp.abs{position:absolute;top:15px;right:15px;z-index:3}
.stp.ok{background:rgba(255,255,255,.16);color:#B7F4CE;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.mcard{margin:13px 15px;border-radius:20px;padding:17px;color:#fff;position:relative;overflow:hidden;box-shadow:0 22px 46px -16px rgba(0,0,0,.55)}
.mcard .wm{position:absolute;left:-26px;bottom:-42px;width:236px;opacity:.14}
.mcard>*{position:relative;z-index:2}
.chip2{width:32px;height:24px;border-radius:5px;background:linear-gradient(135deg,#E8CF7E,#C9A24B 60%,#a9843a);position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.chip2::after{content:"";position:absolute;inset:4px 6px;border:1px solid rgba(0,0,0,.22);border-radius:2px}
.ctls{display:flex;gap:2.5px;align-items:center;margin-left:8px}
.ctls i{display:block;width:6px;height:11px;border:1.5px solid rgba(255,255,255,.68);border-left:none;border-radius:0 6px 6px 0}
.ctls i:nth-child(2){height:14px}.ctls i:nth-child(3){height:17px}
.mno{font-family:"IBM Plex Mono",monospace;font-size:13px;letter-spacing:.13em;margin-top:13px}
.qr{background:#fff;border-radius:10px;padding:7px;display:inline-block;line-height:0;box-shadow:0 5px 14px rgba(0,0,0,.3)}
.act3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;padding:0 15px}
.act3 button{display:flex;flex-direction:column;align-items:center;gap:5px;background:#fff;border:1px solid var(--hair);border-radius:16px;padding:12px 6px;font-size:9px;font-weight:700;color:var(--t1);box-shadow:var(--sh-s);text-align:center}
.act3 .qic{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center}

/* EMERGENCY */
.embar{flex:none;background:#8E1F1C;color:#fff;padding:9px 15px;display:flex;align-items:center;gap:9px;font-size:10.5px;font-weight:800;letter-spacing:-.005em;position:relative;overflow:hidden}
.embar::after{content:"";position:absolute;top:0;bottom:0;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.13),transparent);animation:sweep 3.4s linear infinite}
.embar span.n{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.05em}
.epath{display:block;width:calc(100% - 30px);margin:0 15px 10px;background:#fff;border:1px solid var(--hair);border-left:5px solid var(--ec);border-radius:16px;padding:13px 14px;box-shadow:var(--sh-s);transition:.15s}
.epath:active{transform:scale(.98)}
.epath .top{display:flex;align-items:center;gap:10px}
.epath .ei{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--et);color:var(--ec)}
.epath b{font-size:12px;font-weight:800;color:var(--t1);display:block;letter-spacing:-.015em;line-height:1.25}
.epath small{font-size:8.5px;color:var(--t3);display:block;line-height:1.4;margin-top:2px}
.epath .tag2{margin-left:auto;font-size:7px;font-weight:800;letter-spacing:.09em;padding:3px 7px;border-radius:99px;white-space:nowrap}
.steps{display:flex;gap:5px;margin:0 18px 14px}
.steps i{flex:1;height:3.5px;border-radius:99px;background:#E2E7EB;transition:.3s}
.opt{display:flex;align-items:center;gap:11px;width:calc(100% - 36px);border:1.5px solid var(--hair);border-radius:16px;padding:12px 13px;margin:0 18px 9px;background:#fff;box-shadow:var(--sh-s);transition:.15s}
.opt:active{transform:scale(.98)}
.opt .oic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
.opt b{font-size:12px;color:var(--t1);display:block;font-weight:800;letter-spacing:-.012em}
.opt small{font-size:8.5px;color:var(--t3);display:block;margin-top:2px;line-height:1.4}
.chk{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border-radius:16px;background:#fff;border:1px solid var(--hair);box-shadow:var(--sh-s);margin:0 18px 8px;transition:.25s}
.chk .ic2{width:20px;height:20px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;margin-top:1px;transition:.25s}
.chk b{font-size:11px;color:var(--t1);display:block;font-weight:800}
.chk small{font-size:8.5px;color:var(--t3);display:block;line-height:1.4;margin-top:1px}
.ring{width:118px;height:118px;margin:22px auto 14px;position:relative;display:flex;align-items:center;justify-content:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring b{font-family:"IBM Plex Mono",monospace;font-size:21px;color:var(--t1)}
.refbox{background:#fff;border:1px solid var(--hair);border-radius:16px;padding:12px;box-shadow:var(--sh-s);text-align:center;margin:0 18px 12px}
.proto{margin:0 15px 9px;background:#fff;border:1px solid var(--hair);border-radius:16px;padding:13px 14px;box-shadow:var(--sh-s)}
.proto .pt{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.proto .pw{height:6px;border-radius:99px;background:#EAEEF2;overflow:hidden}
.proto .pw i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--soccer),#5B8AD8)}
.wkrow{display:flex;gap:4px;margin-top:9px}
.wkrow i{flex:1;height:20px;border-radius:5px;background:#EEF1F5;display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono",monospace;font-size:7px;color:var(--t3);font-style:normal;font-weight:600}
.wkrow i.done{background:var(--soccer);color:#fff}
.wkrow i.now{background:#D8E3F5;color:var(--soccer)}

/* SHOP */
.catrow{display:flex;gap:7px;padding:12px 15px 0;overflow-x:auto;scrollbar-width:none}
.catrow::-webkit-scrollbar{display:none}
.catrow button{flex:none;font-size:10px;font-weight:700;padding:7px 13px;border-radius:99px;border:1px solid var(--hair);background:#fff;color:var(--t2);white-space:nowrap;box-shadow:var(--sh-s)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:12px 15px 0}
.st{background:#fff;border:1px solid var(--hair);border-radius:16px;padding:11px 12px;box-shadow:var(--sh-s);transition:.15s;position:relative}
.st:active{transform:scale(.97)}
.st .brand{font-family:"IBM Plex Mono",monospace;font-size:7px;letter-spacing:.13em;text-transform:uppercase;color:var(--t3);display:block}
.st b{font-size:11px;font-weight:800;color:var(--t1);display:block;line-height:1.3;margin-top:2px;letter-spacing:-.01em}
.st .disc{display:inline-block;margin-top:7px;font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;color:#14764D;letter-spacing:-.02em}
.st .sub{font-size:8px;color:var(--t3);display:block;margin-top:1px}
.st .appr{position:absolute;top:9px;right:9px;font-size:6.5px;font-weight:800;letter-spacing:.08em;padding:2px 6px;border-radius:99px;background:#E7F5EC;color:#14764D}
.st .cert{position:absolute;top:9px;right:9px;font-size:6.5px;font-weight:800;letter-spacing:.08em;padding:2px 6px;border-radius:99px;background:#EAF0FA;color:#22499E}
.savebar{margin:12px 15px 0;background:#fff;border:1px solid var(--hair);border-radius:18px;padding:13px 15px;box-shadow:var(--sh-s)}
.savebar .r1{display:flex;justify-content:space-between;align-items:baseline;font-size:9.5px;color:var(--t3);font-weight:600}
.savebar .r1 b{color:var(--t1);font-size:19px;font-family:"IBM Plex Mono",monospace;letter-spacing:-.03em}
.savebar .trk{height:6px;border-radius:99px;background:#EAEEF2;margin-top:9px;overflow:hidden}
.savebar .trk i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#1D9A66,#54C795);transition:width .6s}
.savebar .r2{display:flex;justify-content:space-between;font-family:"IBM Plex Mono",monospace;font-size:7.5px;letter-spacing:.09em;color:var(--t3);margin-top:7px;text-transform:uppercase}

/* ONEPLAN HOSTED chrome */
.ophost{background:#F2F5FA;min-height:100%}
.ophead{background:var(--op);color:#fff;padding:12px 16px}
.ophead .url{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.14);border-radius:8px;padding:6px 10px;font-family:"IBM Plex Mono",monospace;font-size:8.5px;letter-spacing:.04em}
.ophead .t{font-weight:800;font-size:13px;margin-top:9px;letter-spacing:-.015em}
.ophead .s{font-size:9px;opacity:.8;margin-top:1px}
.opbox{margin:12px 15px;background:#fff;border:1px solid #D7DEE9;border-radius:14px;padding:13px 14px}
.opbox h5{margin:0 0 6px;font-size:11.5px;font-weight:800;color:var(--t1)}
.opbox p{margin:0;font-size:9.5px;color:var(--t2);line-height:1.5}
.opcheck{display:flex;gap:9px;align-items:flex-start;margin-top:10px;font-size:9px;color:var(--t2);line-height:1.45}

   ?p=<persona>&t=<tab>&pv=principal&skip=1

   scoping demo must never land a client on a blank screen. */
(function(){
  try{
    const q=new URLSearchParams(location.search);
    const from=q.get('from');
    if(from&&/^[A-Z]\d{1,2}$/.test(from)){
      addEventListener('DOMContentLoaded',()=>{
        const a=document.getElementById('backToSpec');
        if(a) a.href='../demo/#'+from;
      });
    }
    const P=['parent','dependant','coach','school','partner'];
    const T=['profile','oneplan','emergency','shop','more'];
    const p=q.get('p'); if(p&&P.includes(p)) S.persona=p;
    const t=q.get('t'); if(t&&T.includes(t)) S.tab=t;
    if(q.get('pv')==='principal') S.pv='principal';
    if(q.get('skip')==='1'||S.persona!=='parent'){ S.booting=false; S.splashT=8; }
  }catch(e){}
})();

 let body='';

   <span class="ava" style="background:linear-gradient(135deg,${s.lite},${s.hex})">${d.ini}</span>
   <span class="who"><small>Dependant &middot; linked to D. Mokoena</small><b>Hi ${d.first}</b></span>
   <button class="bell" style="color:${s.c}" onclick="toast('Fixture: ${d.team}, Saturday 09:00.')">${ic('bell',18)}</button></div>
  <div class="cover" style="background:linear-gradient(140deg,${s.lite} -25%,${s.hex} 45%,${s.dark})">
   <span class="stp ok abs"><i></i>COVERED</span><div class="wm">${fieldSvg(d.code,'s',{stroke:'#fff',sw:4})}</div>
   <div style="padding-right:74px"><span class="lbl">My cover &middot; ${d.team}</span><div class="amt">${rand(avail)}<small>available</small></div></div>
   <div class="who2">Winter 2027 &middot; valid to 30 September</div>
   <div class="meter"><i style="width:${Math.round(avail/d.cover*100)}%"></i></div>

  <div class="sect"><b>My stuff</b><small>Read only</small></div>
  <button class="row" onclick="toast('Cover card shown. Show this to a coach or clinic &mdash; it proves cover and nothing else.')"><span class="ri" style="background:${s.t};color:${s.c}">${ic('card',17)}</span><span><b>My card</b><small>Show a coach or clinic</small></span><span class="chev">${ic('chev',15,2.2)}</span></button>
  <button class="row" onclick="toast('Blue Card status: ${S.blueActive&&S.depIdx===0?'PROTOCOL ACTIVE, week '+S.protoWeek+' of 6, no contact play':'cleared, no head injury on record'}.')"><span class="ri" style="background:${s.t};color:${s.c}">${ic('brain',17)}</span><span><b>Blue Card</b><small>My clearance status</small></span><span class="pil ${S.blueActive&&S.depIdx===0?'a':'g'}">${S.blueActive&&S.depIdx===0?'PROTOCOL':'CLEARED'}</span></button>
  <button class="row" onclick="toast('Shop shows member pricing, but only your principal member can buy.')"><span class="ri" style="background:${s.t};color:${s.c}">${ic('bag',17)}</span><span><b>Shop</b><small>See prices, cannot buy</small></span><span class="chev">${ic('chev',15,2.2)}</span></button>

  <div class="notice" style="background:#F1EEE4;color:#7A6414">${ic('info',13,2.1)}<span>You can see <b>your own cover only</b>. Emergency, claims, payment and policy changes stay with your principal member.</span></div>
  <div class="dashrow" style="display:flex;align-items:center;gap:8px;margin:11px 15px 0;padding:10px 12px;border-radius:14px;border:1.5px dashed #C9D2DB;color:#5C6772;font-size:9.5px;font-weight:600;cursor:pointer" onclick="switchDep()">${ic('users',14)} Demo: switch dependant login</div>

function switchDep(){S.depIdx=(S.depIdx+1)%HH.deps.length;render();toast(`Now viewing ${dep().first}'s login.`);}
function tellParent(){const d=dep();
 notify(`<b>${d.first}</b> reported an injury from their own login. Open the Emergency tab.`);
 S.logs.unshift(`15:03 dependant &middot; ${d.short} raised an alert to the principal member`);
 render();toast('Your parent has been notified. They will start the emergency flow.');}

  <div class="body"><div class="view">
   <div style="padding:14px 18px 6px;color:#fff">
     <span class="mono" style="font-size:8.5px;letter-spacing:.18em;color:var(--brass);display:flex;align-items:center;gap:7px">${ic('scan',13,2)} COACH FIELD PORTAL &middot; OFFLINE OK</span>
     <div style="font-weight:900;font-size:19px;margin-top:5px;letter-spacing:-.025em">${sel?'Player scanned':'Team sheet'}</div>

        :`<button class="btnP" style="background:var(--brass);color:#3a2a05" onclick="coachAlert('${sel.no}',${sel.dep===undefined?'null':sel.dep})">${icF('cross',16)} Alert the guardian &amp; call centre</button>`):''}

   ${T.roster.map((p,i)=>`<button class="dk-tile" style="display:flex;justify-content:space-between;align-items:center;width:calc(100% - 30px);margin:9px 15px 0;background:#16241D;border:1px solid ${blueBlocked(p)?'#4A3D6B':'#24382E'};border-radius:16px;padding:12px 13px;color:#fff" onclick="S.coachSel=${i};coachLog(${i})">
     <span><b style="font-size:12.5px;font-weight:800">${p.n}</b><small style="display:block;font-family:'IBM Plex Mono',monospace;font-size:8px;color:#7fa08f;margin-top:2px">MF-2027-${p.no}</small></span>
     <span class="stp" style="${blueBlocked(p)?'background:#3A2F52;color:#C9B8E8':p.s==='covered'?'background:rgba(87,201,143,.15);color:#57C98F':p.s==='lapsed'?'background:#C0392B;color:#fff':'background:#3A3226;color:#DDBB7A'}"><i></i>${blueBlocked(p)?'BLUE CARD':p.s.toUpperCase()}</span></button>`).join('')}

  </div></div><div class="toast"></div>

  <div class="homebar"><i></i></div>
 </div></div></div>`+notes();
}
function coachLog(i){const T=TEAMS[S.coachTeam];
 S.logs.unshift(`16:48 lookup &middot; ${T.coach} &rarr; MF-2027-${T.roster[i].no} &middot; guardian notified &middot; logged`);
 render();setTimeout(()=>toast('Guardian notified by SMS now.'),300);}
function coachAlert(no,depIdx){
 const ref='ALERT-'+(220+Object.keys(S.coachClaimed).length);
 S.coachClaimed[no]=ref;
 S.logs.unshift(`16:49 alert &middot; ${ref} raised on-field by coach &middot; call centre engaged`);
 if(depIdx!==null&&depIdx!==undefined)notify(`Coach raised <b>${ref}</b> for ${HH.deps[depIdx].first} on the field. Open the Emergency tab.`);
 render();toast(`${ref} sent. Guardian and call centre notified.`);
}

/* ============ FOOTER ============ */

   demo shows only the product, plus the one line that must stay on a public
   insurance demo. */

function render(){
 const v={parent:renderParent,dependant:renderDependant,coach:renderCoach,school:renderSchool,partner:renderPartner}[S.persona]();

   const b=scr.querySelector('.body');
   if(b&&b.scrollHeight-b.clientHeight>6)scr.setAttribute('data-scrolls','');

}
renderShell();
if(S.booting) bootSplash();
